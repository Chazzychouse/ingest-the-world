[project]
name = "ingest-api"
version = "0.1.0"
description = "Platform API for the Ingest the World geospatial data platform"
requires-python = ">=3.12"
dependencies = [
    "azure-identity>=1.26.0",
    "azure-servicebus>=7.14",
    "azure-storage-blob>=12.31.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "psycopg[binary,pool]>=3.3.6",
    "pyarrow>=18",
    "pydantic-settings>=2.16.1",
    "pyjwt[crypto]>=2.15.1",
    "rasterio>=1.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "cryptography>=50.0.2",
    "httpx2>=2.16.0",
    "hypothesis>=6.170.9",
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "schemathesis>=4.32.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["error"]  # Power of 10, rule 10: warnings fail the build
# The end-to-end suite needs the running stack and the sample cache; `make e2e` selects it.
addopts = ["-m", "not e2e"]
markers = ["e2e: drives the running local stack (make up) with the sample corpus"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "I", "B", "UP", "S", "ASYNC",
    "C4", "C90", "SIM", "RET", "PL", "BLE", "PTH", "RUF", "TID", "T20", "FBT", "PERF",
]
ignore = [
    "S101",     # assert is fine in tests; production code raises typed errors (AGENTS.md)
    "PLR2004",  # magic values: HTTP status codes read better inline
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 6
max-branches = 10
max-returns = 6
max-statements = 40

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pyright]
include = ["ingest_api", "tests", "tools"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
# Tests use fixtures and Hypothesis strategies whose types pytest injects at runtime.
venvPath = "."
venv = ".venv"
executionEnvironments = [
    { root = "ingest_api", extraPaths = ["."] },
    { root = "tools", extraPaths = ["."] },
    { root = "tests", extraPaths = ["."], reportUnknownMemberType = false, reportUnknownVariableType = false, reportUnknownArgumentType = false, reportUnknownParameterType = false, reportMissingParameterType = false, reportMissingTypeArgument = false, reportPrivateUsage = false },
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]  # seeded RNGs drive the simulator
"tools/**" = ["S603", "T201"]  # CLI scripts report on stdout
"ingest_api/migrate.py" = ["T201"]
