server {
    listen 80;
    root /usr/share/nginx/html;

    # `/api/x` -> `http://api:8000/x`, matching the Vite dev proxy.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    # `/tiles/x` -> `http://tiler:8001/tiles/x`: preview tiles, under the API's preview tokens.
    location /tiles/ {
        proxy_pass http://tiler:8001;
        # With its port: the tiler's TileJSON names its tiles by the host the browser asked.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location / {
        try_files $uri /index.html;
    }
}
