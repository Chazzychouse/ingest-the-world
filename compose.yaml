# Local stack, no cloud account required.
#   make up    then open http://localhost:8081  (users: alice / carol / bob)
# The queue (Service Bus emulator, its SQL Server, the event shim and the worker) is in the
# `queue` profile,
# which `make` enables once ACCEPT_EULA=Y is in .env (see .env.example).
name: ingest-the-world

services:
  db:
    build: infra/docker/postgres
    image: ingest-postgres:dev
    environment:
      POSTGRES_USER: ingest
      POSTGRES_PASSWORD: ingest
      POSTGRES_DB: ingest
    ports: ["5432:5432"]
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ingest -d ingest"]
      interval: 3s
      retries: 20

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck --location /data
    environment:
      # The default account for the stack, and a separate one for the test suite.
      AZURITE_ACCOUNTS: devstoreaccount1:Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;ingesttest:aW5nZXN0LXRoZS13b3JsZC10ZXN0LWFjY291bnQta2V5LTMyYg==
    ports: ["10000:10000", "10001:10001", "10002:10002"]
    volumes: [azurite-data:/data]

  keycloak:
    image: quay.io/keycloak/keycloak:26.5
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      # Tokens always carry iss=http://localhost:8080/..., matching what the browser sees,
      # while containers can still reach Keycloak as keycloak:8080.
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports: ["8080:8080"]
    volumes: [./infra/keycloak:/opt/keycloak/data/import:ro]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 5s
      retries: 40

  migrate:
    build: api
    image: ingest-api:dev
    command: ["python", "-m", "ingest_api.migrate", "--seed"]
    environment: &api-env
      INGEST_DATABASE_URL: postgresql://ingest:ingest@db:5432/ingest
      INGEST_OIDC_ISSUER: http://localhost:8080/realms/ingest
      INGEST_OIDC_AUDIENCE: ingest-api
      INGEST_OIDC_JWKS_URI: http://keycloak:8080/realms/ingest/protocol/openid-connect/certs
      INGEST_WEB_OIDC_AUTHORITY: http://localhost:8080/realms/ingest
      INGEST_WEB_OIDC_CLIENT_ID: ingest-web
      # Azurite's published development key; the cloud signs with managed identity instead.
      INGEST_BLOB_ACCOUNT_URL: http://azurite:10000/devstoreaccount1
      INGEST_BLOB_ACCOUNT_KEY: Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==
      INGEST_BLOB_PUBLIC_URL: http://localhost:10000/devstoreaccount1
      # The web app's origins (Vite, nginx): Azurite has no CORS rule until one is set.
      INGEST_BLOB_CORS_ORIGINS: '["http://localhost:5173", "http://localhost:8081"]'
      # The emulator's fixed connection string; the cloud uses managed identity instead.
      INGEST_QUEUE_CONNECTION: Endpoint=sb://servicebus;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
    depends_on:
      db: { condition: service_healthy }

  api:
    image: ingest-api:dev
    environment: *api-env
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      keycloak: { condition: service_healthy }
      azurite: { condition: service_started }

  # Stands in for Event Grid: announces committed landing/ blobs on the ingest queue.
  event-shim:
    image: ingest-api:dev
    command: ["python", "-m", "ingest_api.event_shim"]
    environment: *api-env
    profiles: [queue]
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
      azurite: { condition: service_started }
      servicebus: { condition: service_started }

  # Takes blob events off the queue: scan, promote to raw/, catalog (ingest_api.worker).
  worker:
    image: ingest-api:dev
    command: ["python", "-m", "ingest_api.worker"]
    environment: *api-env
    profiles: [queue]
    # A bug the worker doesn't catch stops it; its message comes back to the restarted worker,
    # and after the queue's last delivery is swept from the dead letters (ING-2).
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
      azurite: { condition: service_started }
      servicebus: { condition: service_started }

  servicebus:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:2.0.1
    profiles: [queue]
    environment:
      SQL_SERVER: servicebus-sql
      MSSQL_SA_PASSWORD: &sql-password Ingest-dev-only-1
      ACCEPT_EULA: ${ACCEPT_EULA:-N}
    volumes: [./infra/servicebus/config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro]
    # 5672 is AMQP; 5300 serves /health, which `make` polls (the image has no shell for a
    # healthcheck).
    ports: ["5672:5672", "5300:5300"]
    depends_on:
      servicebus-sql: { condition: service_healthy }

  servicebus-sql:
    image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
    profiles: [queue]
    environment:
      MSSQL_SA_PASSWORD: *sql-password
      ACCEPT_EULA: ${ACCEPT_EULA:-N}
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null
      interval: 5s
      retries: 30

  web:
    build: web
    image: ingest-web:dev
    ports: ["8081:80"]
    depends_on: [api]

volumes:
  db-data:
  azurite-data:
